name: PyTorch Scatter (CPU)

permissions: {}

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      PYTORCH_SCATTER_VERSION:
        description: "PyTorch Scatter version"
        required: true
        default: "2.1.2"
        type: string
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  plan-matrix:
    name: Plan build matrix
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}
    permissions:
      contents: read # for actions/checkout
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.9.26"
          enable-cache: false

      - name: Generate build matrix
        id: generate-matrix
        run: |
          echo "matrix=$(uv run --script plan-matrix-cpu.py)" >> $GITHUB_OUTPUT
        env:
          LIMIT_MATRIX: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-build') && '1' || '0' }}

  build-wheels:
    name: Build Wheel
    needs: [plan-matrix]
    runs-on: ${{ matrix.RUNNER }}
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-build') }}

    permissions:
      contents: write
      actions: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-matrix.outputs.matrix) }}

    steps:
      - name: Determine PyTorch Scatter version
        id: pytorch-scatter-version
        run: |
          # Extract PyTorch Scatter version from tag. Tags can be either:
          # - 2.1.2 (legacy format; maps directly to PyTorch Scatter version)
          # - 2.1.2-r1 (new format; strip -rN suffix to get PyTorch Scatter version)
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${GITHUB_REF_NAME}"
            # Remove -rN suffix if present
            PYTORCH_SCATTER_VERSION="${TAG%-r*}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PYTORCH_SCATTER_VERSION="${INPUTS_PYTORCH_SCATTER_VERSION}"
          else
            PYTORCH_SCATTER_VERSION="2.1.2"
          fi
          # Map version to commit hash (upstream tags are outdated)
          if [ "${PYTORCH_SCATTER_VERSION}" = "2.1.2" ]; then
            PYTORCH_SCATTER_REF="648dda3cf964731ffb4de11eafc445a83133eda4"
          else
            PYTORCH_SCATTER_REF="${PYTORCH_SCATTER_VERSION}"
          fi
          echo "version=${PYTORCH_SCATTER_VERSION}" >> $GITHUB_OUTPUT
          echo "ref=${PYTORCH_SCATTER_REF}" >> $GITHUB_OUTPUT
          echo "Using PyTorch Scatter version: ${PYTORCH_SCATTER_VERSION} (ref: ${PYTORCH_SCATTER_REF})"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUTS_PYTORCH_SCATTER_VERSION: ${{ inputs.PYTORCH_SCATTER_VERSION }}

      - name: Checkout PyTorch Scatter
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: rusty1s/pytorch_scatter
          ref: ${{ steps.pytorch-scatter-version.outputs.ref }}
          persist-credentials: false

      - name: Get source commit SHA
        id: source-commit
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Checkout utils
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: build_scripts
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.9.26"
          enable-cache: false

      - name: Set build variables
        run: |
          echo "MATRIX_TORCH_VERSION=$(echo ${{ matrix.MATRIX_TORCH_VERSION }})" >> $GITHUB_ENV
          echo "MATRIX_PYTHON_VERSION=$(echo ${{ matrix.MATRIX_PYTHON_VERSION }})" >> $GITHUB_ENV
          echo "MANYLINUX_GLIBC_VERSION=$(echo ${{ matrix.MANYLINUX_GLIBC_VERSION }})" >> $GITHUB_ENV
          echo "CI_AUDITWHEEL_EXCLUDES=$(echo ${{ matrix.CI_AUDITWHEEL_EXCLUDES }})" >> $GITHUB_ENV

      - name: Install cibuildwheel
        run: |
          uv venv --python 3.13
          uv pip install cibuildwheel

      - name: Build wheels for PyTorch Scatter ${{ matrix.torch-version }}+cpu
        run: |
          .venv/bin/cibuildwheel --output-dir dist
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.target-arch }}
          CIBW_BUILD: cp${{ env.MATRIX_PYTHON_VERSION }}-*64
          CIBW_BEFORE_ALL: >
            curl -LsSf https://astral.sh/uv/install.sh | sh
          CIBW_BEFORE_BUILD_LINUX: >
            uv pip install typing-extensions==4.12.2 setuptools wheel ninja packaging &&
            uv pip install --no-cache-dir --index-strategy unsafe-first-match torch==${{ matrix.torch-version }} --index-url https://download.pytorch.org/whl/cpu &&
            bash build_scripts/prepare_for_build.sh ${{ steps.pytorch-scatter-version.outputs.version }}
          CIBW_ENVIRONMENT: >
            PATH=$PATH:/root/.local/bin
            AUDITWHEEL_PLAT="manylinux_${{ env.MANYLINUX_GLIBC_VERSION }}_$(uname -m)"
            MATRIX_TORCH_VERSION=${{ env.MATRIX_TORCH_VERSION }}
            MATRIX_PYTHON_VERSION=${{ env.MATRIX_PYTHON_VERSION }}
            FORCE_ONLY_CPU=1
            FORCE_CXX11_ABI=${{ matrix.cxx11-abi }}
            MAX_JOBS=8
            UV_PYTHON=/opt/python/cp${{ env.MATRIX_PYTHON_VERSION }}-cp${{ env.MATRIX_PYTHON_VERSION }}/bin/python
            CI_AUDITWHEEL_EXCLUDES="${{ env.CI_AUDITWHEEL_EXCLUDES }}"
          CIBW_SKIP: "*musllinux*"
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: "auditwheel repair -w /tmp/cibuildwheel/repaired_wheel {wheel} ${CI_AUDITWHEEL_EXCLUDES}"
          CIBW_BUILD_FRONTEND: "build[uv]; args: --no-isolation"

      - name: Embed SBOM into wheel
        run: |
          for wheel in dist/*.whl; do
            uv run --no-project --script build_scripts/embed_patches.py "$wheel" "build_scripts/patches/${PYTORCH_SCATTER_VERSION}" \
              --source-repo "https://github.com/rusty1s/pytorch_scatter" \
              --source-tag "${PYTORCH_SCATTER_VERSION}" \
              --source-commit "${SOURCE_COMMIT}" \
              --build-repo "https://github.com/astral-sh-build/build-pytorch-scatter" \
              --build-commit "${BUILD_COMMIT}"
          done
        env:
          PYTORCH_SCATTER_VERSION: ${{ steps.pytorch-scatter-version.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source-commit.outputs.sha }}
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Log Built Wheels
        run: |
          wheel_name=$(ls dist/*whl | xargs -n 1 basename)
          echo "wheel_name=${wheel_name}" >> $GITHUB_ENV
          ls dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'release'
        with:
          name: ${{env.wheel_name}}
          path: dist/${{env.wheel_name}}
          if-no-files-found: error

      - name: Upload wheels to release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" ./dist/*.whl --clobber
